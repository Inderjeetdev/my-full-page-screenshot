<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ZiS</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      width: 320px;

      margin: 0;

      padding: 20px;

      font-family:
        "Segoe UI",
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

      background-color: #ffffff;

      color: #333333;
    }


    .header {

      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 20px;

      border-bottom:
        1px solid #eeeeee;

      padding-bottom: 10px;
    }


    .logo {

      display: flex;

      align-items: center;

      gap: 8px;

      font-size: 20px;

      font-weight: 700;

      color: #2563eb;
    }


    .logo-icon {

      width: 30px;

      height: 30px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 6px;

      background-color: #2563eb;

      color: #ffffff;

      font-weight: 800;

      font-size: 13px;
    }


    .settings-icon {

      color: #888888;

      font-size: 18px;

      cursor: pointer;
    }


    .setting-row {

      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 15px;

      font-size: 14px;
    }


    .setting-label {

      font-weight: 600;
    }


    .radio-group {

      display: flex;

      gap: 15px;
    }


    .radio-group label {

      cursor: pointer;
    }


    .slider-container {

      margin-bottom: 15px;
    }


    .slider-header {

      display: flex;

      justify-content: space-between;

      margin-bottom: 8px;

      font-size: 14px;
    }


    .speed-labels {

      display: flex;

      justify-content: space-between;

      margin-top: 5px;

      color: #888888;

      font-size: 11px;
    }


    input[type="range"] {

      width: 100%;

      accent-color: #2563eb;
    }


    .toggle-container {

      display: flex;

      align-items: center;

      gap: 10px;
    }


    .toggle-switch {

      position: relative;

      display: inline-block;

      width: 40px;

      height: 22px;
    }


    .toggle-switch input {

      width: 0;

      height: 0;

      opacity: 0;
    }


    .slider {

      position: absolute;

      top: 0;

      right: 0;

      bottom: 0;

      left: 0;

      border-radius: 22px;

      background-color: #cccccc;

      cursor: pointer;

      transition:
        0.25s;
    }


    .slider:before {

      position: absolute;

      content: "";

      width: 16px;

      height: 16px;

      left: 3px;

      bottom: 3px;

      border-radius: 50%;

      background-color: #ffffff;

      transition:
        0.25s;
    }


    input:checked + .slider {

      background-color: #2563eb;
    }


    input:checked + .slider:before {

      transform:
        translateX(18px);
    }


    .capture-btn {

      width: 100%;

      margin-top: 10px;

      padding: 12px;

      border: none;

      border-radius: 8px;

      background-color: #2563eb;

      color: #ffffff;

      font-size: 16px;

      font-weight: 600;

      cursor: pointer;

      transition:
        background-color 0.2s,
        opacity 0.2s;
    }


    .capture-btn:hover:not(:disabled) {

      background-color: #1d4ed8;
    }


    .capture-btn:disabled {

      cursor: wait;
    }


    .status-bar {

      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-top: 15px;

      color: #555555;

      font-size: 13px;
    }


    .progress-bar {

      width: 100%;

      height: 4px;

      margin-top: 5px;

      overflow: hidden;

      border-radius: 2px;

      background-color: #eeeeee;
    }


    .progress-fill {

      width: 0%;

      height: 100%;

      border-radius: 2px;

      background-color: #2563eb;

      transition:
        width 0.2s ease;
    }


    .footer {

      display: flex;

      justify-content: space-between;

      margin-top: 15px;

      padding-top: 10px;

      border-top:
        1px solid #eeeeee;

      color: #2563eb;

      font-size: 12px;
    }


    .footer span {

      cursor: pointer;
    }

  </style>

</head>


<body>


  <div class="header">

    <div class="logo">

      <div class="logo-icon">
        tb
      </div>

      <span>
        ZiS
      </span>

    </div>


    <div class="settings-icon">
      ⚙️
    </div>

  </div>


  <!-- Format -->

  <div class="setting-row">

    <span class="setting-label">
      Format:
    </span>


    <div class="radio-group">

      <label>
        <input
          type="radio"
          name="format"
          value="png"
          checked
        >
        PNG
      </label>


      <label>
        <input
          type="radio"
          name="format"
          value="jpg"
        >
        JPG
      </label>

    </div>

  </div>


  <!-- Auto-scroll speed -->

  <div class="slider-container">

    <div class="slider-header">

      <span class="setting-label">
        Auto-scroll speed:
      </span>


      <span
        id="speedValue"
        style="color:#2563eb;"
      >
        Medium
      </span>

    </div>


    <input
      type="range"
      id="speedSlider"
      min="1"
      max="3"
      step="1"
      value="2"
    >


    <div class="speed-labels">

      <span>
        Slow
      </span>

      <span>
        Medium
      </span>

      <span>
        Fast
      </span>

    </div>

  </div>


  <!-- Notifications -->

  <div class="setting-row">

    <span class="setting-label">
      Show notifications:
    </span>


    <div class="toggle-container">

      <label class="toggle-switch">

        <input
          type="checkbox"
          id="notifyToggle"
          checked
        >

        <span class="slider"></span>

      </label>

    </div>

  </div>


  <!-- Capture -->

  <button
    id="captureBtn"
    class="capture-btn"
  >
    📸 Capture Full Page
  </button>


  <!-- Status -->

  <div class="status-bar">

    <span id="status">
      Ready
    </span>


    <span id="percent">
      0%
    </span>

  </div>


  <div class="progress-bar">

    <div
      id="progressFill"
      class="progress-fill"
    ></div>

  </div>


  <!-- Footer -->

  <div class="footer">

    <span>
      ❓ Help
    </span>


    <span>
      ↗ Open dashboard
    </span>

  </div>


  <script src="popup.js"></script>

</body>

</html>
